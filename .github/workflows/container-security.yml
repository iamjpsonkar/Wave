name: Filesystem and container security

on:
  workflow_call:
  schedule:
    - cron: "11 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy filesystem and production image scan
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked dependencies for filesystem analysis
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scan repository filesystem and dependency manifests
        id: trivy-fs
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          format: sarif
          output: trivy-filesystem.sarif
          timeout: 10m
          version: v0.76.2
          cache: false
      - name: Build production image from the canonical Dockerfile
        run: docker build --pull -t wave:security .
      - name: Scan the exact production image built above
        id: trivy-image
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: wave:security
          vuln-type: os,library
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          format: sarif
          output: trivy-image.sarif
          timeout: 10m
          version: v0.76.2
          cache: false
      - name: Print actionable filesystem findings when a scan fails
        if: always() && steps.trivy-fs.outcome == 'failure'
        continue-on-error: true
        run: trivy fs --scanners vuln,misconfig --severity HIGH,CRITICAL --format table .
      - name: Print actionable production-image findings when a scan fails
        if: always() && steps.trivy-image.outcome == 'failure'
        continue-on-error: true
        run: trivy image --severity HIGH,CRITICAL --format table wave:security
      - name: Upload Trivy filesystem SARIF to GitHub code scanning
        if: always() && hashFiles('trivy-filesystem.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy-filesystem.sarif
          category: trivy-filesystem
        continue-on-error: true
      - name: Upload Trivy image SARIF to GitHub code scanning
        if: always() && hashFiles('trivy-image.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-production-image
        continue-on-error: true
      - name: Preserve Trivy reports as short-retention artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-security-reports
          path: trivy-*.sarif
          if-no-files-found: ignore
          retention-days: 14
      - name: Enforce high and critical severity threshold
        if: always()
        env:
          FILESYSTEM_OUTCOME: ${{ steps.trivy-fs.outcome }}
          IMAGE_OUTCOME: ${{ steps.trivy-image.outcome }}
        run: |
          if [[ "$FILESYSTEM_OUTCOME" != "success" || "$IMAGE_OUTCOME" != "success" ]]; then
            echo "::error::Trivy found a HIGH/CRITICAL finding or a scan failed. Inspect the SARIF report and scanner logs; do not suppress without an expiring, reviewed exception."
            exit 1
          fi
