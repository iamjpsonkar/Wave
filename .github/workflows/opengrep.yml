name: OpenGrep security analysis
on:
  workflow_call:
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: opengrep-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    name: OpenGrep SAST (pinned release binary)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify OpenGrep 2.0.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/opengrep/opengrep/releases/download/v2.0.0/opengrep_linux_x86 \
            --output "$RUNNER_TEMP/opengrep"
          echo "37e93f4da5fd04a18c5c1febbdd12f7e98dfccd4d0c9cf2593bcb25eeb462da0  $RUNNER_TEMP/opengrep" | sha256sum --check -
          chmod 0755 "$RUNNER_TEMP/opengrep"
          "$RUNNER_TEMP/opengrep" --version
      - name: Validate the repository's OpenGrep rules
        run: |
          "$RUNNER_TEMP/opengrep" validate .github/opengrep-rules.yml
      - name: Scan application and engineering scripts
        run: |
          "$RUNNER_TEMP/opengrep" scan \
            --config .github/opengrep-rules.yml \
            --sarif-output=opengrep-results.sarif \
            --strict --error src scripts config
      - name: Upload OpenGrep SARIF report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opengrep-sarif
          path: opengrep-results.sarif
          if-no-files-found: ignore
          retention-days: 14
