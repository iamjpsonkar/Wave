name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Functional build and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Validate workflow YAML and security policy
        run: |
          ruby -e 'require "yaml"; Dir.glob(".github/workflows/*.{yml,yaml}").sort.each { |file| YAML.parse_file(file); puts "Validated #{file}" }'
          node scripts/check-workflow-security.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Audit locked dependency license metadata
        run: npm run license:audit
      - name: Install CI-matched Playwright runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run the same local verification script used by developers
        run: ./test.sh --skip-install --skip-playwright-install --skip-browser-install
      - name: Upload browser test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wave-playwright-diagnostics
          path: |
            test-results/
            playwright-report/
            config/test-results/
            config/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  container:
    name: Container configuration and image build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Compose configuration
        run: docker compose config -q
      - name: Build production container image
        run: docker build --pull -t wave:ci .
      - name: Validate production Nginx configuration
        run: docker run --rm --entrypoint nginx wave:ci -t
