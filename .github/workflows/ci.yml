name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Export generated npm lockfile for repository pinning
        run: |
          echo WAVE_LOCKFILE_BEGIN
          cat package-lock.json
          echo WAVE_LOCKFILE_END
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
