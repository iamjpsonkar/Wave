name: Dependency security
on:
  workflow_call:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  npm-audit:
    name: npm audit (locked production and development dependencies)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit lockfile (fail on high or critical)
        shell: bash
        run: |
          audit_status=0
          npm audit --audit-level=high --json > npm-audit.json || audit_status=$?
          if [[ -s npm-audit.json ]]; then
            node scripts/report-npm-audit.mjs npm-audit.json
          else
            echo "::error::npm audit did not produce a JSON report."
          fi
          exit "$audit_status"
      - name: Preserve dependency audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: ignore
          retention-days: 14
