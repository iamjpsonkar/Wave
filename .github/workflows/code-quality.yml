name: Code quality
on:
  workflow_call:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  eslint:
    name: ESLint JavaScript and TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked project dependencies
        run: npm ci
      - name: Install pinned lint tooling without changing the application lockfile
        run: npm install --no-save --package-lock=false eslint@10.15.0 @eslint/js@10.0.1 typescript-eslint@8.72.2 globals@17.14.0
      - name: Run ESLint on application, scripts, config and tests
        run: npx eslint src scripts config tests --format stylish
