version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 8
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps
      include: scope
  - package-ecosystem: github-actions
    directory: /.github/workflows
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 8
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: ci
      include: scope
